# AI Call Center Nginx Configuration for Docker and Ubuntu 24 Production
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Frontend Assets
    root /usr/share/nginx/html;
    index index.html;

    # Direct Android APK Download with correct MIME type
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Content-Type application/vnd.android.package-archive;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        gzip off;
        try_files $uri =404;
    }

    # High-Performance Video Streaming with HTTP Range Request Support (HTTP 206 Partial Content)
    location ~* \.(mp4|webm|ogg)$ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800, immutable";
        gzip off;
        try_files $uri =404;
    }

    # Video Subtitles (WebVTT)
    location ~* \.vtt$ {
        default_type text/vtt;
        add_header Content-Type "text/vtt; charset=utf-8";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Bundled Web Fonts (woff2) Cache
    location ~* \.(woff2|woff|ttf|eot)$ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static assets cache (Next.js hashed files)
    location /_next/static/ {
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend Routing Fallback
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    # API Proxy with WebSocket Support (Twilio & Mobile Audio Streams)
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running voice calls & media streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Direct Health Check Route
    location /health {
        proxy_pass http://api_upstream/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
