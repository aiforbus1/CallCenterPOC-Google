name: callcenter_mobile
description: "AI-Powered Call Center Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  audioplayers: ^6.0.0
  record: ^5.1.2
  path_provider: ^2.1.2
  file_picker: ^8.0.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
