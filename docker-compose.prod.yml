services:
  postgres:
    image: postgres:16-alpine
    container_name: callcenter_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-callcenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-callcenter_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-callcenterdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-callcenter} -d ${POSTGRES_DB:-callcenterdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: callcenter_redis_prod
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-callcenter_redis_pass}"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-callcenter_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: callcenter_api_prod
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-callcenter}:${POSTGRES_PASSWORD:-callcenter_secure_pass}@postgres:5432/${POSTGRES_DB:-callcenterdb}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-callcenter}:${POSTGRES_PASSWORD:-callcenter_secure_pass}@postgres:5432/${POSTGRES_DB:-callcenterdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-callcenter_redis_pass}@redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  worker:
    build:
      context: ./services/api
      dockerfile: ../../infrastructure/docker/Dockerfile.api
    container_name: callcenter_worker_prod
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-callcenter}:${POSTGRES_PASSWORD:-callcenter_secure_pass}@postgres:5432/${POSTGRES_DB:-callcenterdb}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-callcenter}:${POSTGRES_PASSWORD:-callcenter_secure_pass}@postgres:5432/${POSTGRES_DB:-callcenterdb}
      REDIS_URL: redis://:${REDIS_PASSWORD:-callcenter_redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: callcenter_web_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data_prod:
  redis_data_prod:
